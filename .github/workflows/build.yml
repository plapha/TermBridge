name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:windows
            artifact: windows-installer
            files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-24.04
            script: build:linux
            artifact: linux-deb
            files: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            script: build:macos
            artifact: macos-dmg
            files: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            # Intel + Apple Silicon 通用包
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Rust tests
        run: cargo test --workspace
      - name: Frontend dependencies
        run: npm ci --prefix apps/desktop
      - name: Build desktop installer (includes CLI)
        working-directory: apps/desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # 推送 v* 标签时，三个平台都构建成功后发布到 Releases。
  # 也可以在 main 上手动运行本工作流（workflow_dispatch）来发布：用于无法推送标签的环境，
  # 标签 v<tauri.conf.json 的版本> 由 gh release create 在该提交上创建；标签已存在时报错。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "tag v$version already exists; bump the version first"
            exit 1
          fi
          echo "name=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "TermBridge $TAG" --generate-notes
