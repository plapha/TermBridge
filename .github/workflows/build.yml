name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:windows
            artifact: windows-installer
            files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-24.04
            script: build:linux
            artifact: linux-deb
            files: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            script: build:macos
            artifact: macos-dmg
            files: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            # Intel + Apple Silicon 通用包
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Rust tests
        run: cargo test --workspace
      - name: Frontend dependencies
        run: npm ci --prefix apps/desktop
      - name: Build desktop installer (includes CLI)
        working-directory: apps/desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # 推送 v* 标签时，三个平台都构建成功后发布到 Releases。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match app version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "TermBridge $GITHUB_REF_NAME" --generate-notes
