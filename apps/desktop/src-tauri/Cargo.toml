[package]
name = "termbridge-desktop"
version = "0.1.1"
description = "TermBridge 桌面前端壳（Tauri v2）"
edition = "2021"

# 本 crate 实现 Tauri IPC 和桌面生命周期；网络与会话核心共享 crates/app。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
keyring = "3"
base64 = "0.22"
termbridge = { path = "../../../crates/app" }
termbridge-protocol = { path = "../../../crates/protocol" }

# M2：屏蔽 WebView2 浏览器快捷键（主要给 ICoreWebView2Settings3 的 cast）。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
