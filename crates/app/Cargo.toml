[package]
name = "termbridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
termbridge-protocol = { path = "../protocol" }
termbridge-host = { path = "../host" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
russh = { version = "0.63", default-features = false, features = ["ring"] }
argon2 = "0.5"
rand = "0.10"
rpassword = "7"
keyring = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
